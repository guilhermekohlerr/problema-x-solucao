<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Problema X Solução</title>
<style>
  :root {
    --bg: #0b0e14;
    --bg-elevado: #11161d;
    --card: #171e27;
    --border: #25303d;
    --text: #eef5ff;
    --text-muted: #8995a5;
    --accent: #e50914;
    --accent-2: #43a6ff;
    --accent-bg: #2a1216;
    --tag-bg: #1d2732;
    --mono-bg: #0d1218;
    --chip-selecionado: #04060a;
    --shadow: 0 10px 28px rgba(0,0,0,.25);
    --shadow-hover: 0 22px 48px rgba(0,0,0,.5);
  }
  [data-tema="claro"] {
    --bg: #f4f5f7;
    --bg-elevado: #ffffff;
    --card: #ffffff;
    --border: #dcdfe4;
    --text: #1f2328;
    --text-muted: #656d76;
    --accent: #d20a13;
    --accent-2: #1a5fb4;
    --accent-bg: #fbe7e8;
    --tag-bg: #eef0f2;
    --mono-bg: #f6f8fa;
    --chip-selecionado: #d3d7dd;
    --shadow: 0 1px 2px rgba(0,0,0,0.06);
    --shadow-hover: 0 12px 28px rgba(0,0,0,0.12);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: 'Segoe UI Rounded', ui-rounded, 'SF Pro Rounded', 'Nunito', 'Quicksand', -apple-system, "Segoe UI", Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    transition: background 0.25s ease, color 0.25s ease;
  }
  button { font-family: inherit; cursor: pointer; transition: transform 0.12s ease, background 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease; }
  button:active { transform: scale(0.96); }

  .layout { display: grid; grid-template-columns: 250px 1fr; align-items: start; min-height: 100vh; }

  /* ---------- SIDEBAR DE FILTROS ---------- */
  .sidebar {
    position: sticky;
    top: 0;
    height: 100vh;
    overflow-y: auto;
    background: var(--bg-elevado);
    border-right: 1px solid var(--border);
    padding: 20px 16px 30px;
  }
  .sidebar h1 { font-size: 16px; font-weight: 700; margin: 0 0 2px; letter-spacing: -0.01em; }
  .sidebar .sub { color: var(--text-muted); font-size: 12px; margin: 0 0 16px; }

  .busca-filtros-wrap { position: relative; margin-bottom: 18px; }
  .busca-filtros-wrap span { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); font-size: 12px; opacity: .6; pointer-events: none; }
  #buscaFiltros {
    width: 100%; padding: 8px 10px 8px 30px; border: 1px solid var(--border); border-radius: 100px;
    font-size: 12.5px; background: var(--card); color: var(--text);
  }
  #buscaFiltros:focus { outline: none; border-color: var(--accent-2); box-shadow: 0 0 0 3px var(--accent-bg); }

  .filtros-ativos-caixa { margin-bottom: 20px; padding-bottom: 16px; border-bottom: 1px solid var(--border); animation: aparece-filtro 0.18s ease; }
  .filtros-ativos-topo { display: flex; align-items: center; justify-content: space-between; margin-bottom: 9px; }
  .filtros-ativos-topo span { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--text-muted); }
  #btnLimparFiltros { background: none; border: none; color: var(--accent-2); font-size: 11.5px; font-weight: 700; padding: 2px; }
  #btnLimparFiltros:hover { text-decoration: underline; }
  .chips-ativos { display: flex; flex-wrap: wrap; gap: 6px; }
  .chip-ativo {
    display: inline-flex; align-items: center; gap: 6px; padding: 5px 6px 5px 10px; border-radius: 8px;
    background: var(--chip-selecionado); color: var(--text); font-size: 11.5px; font-weight: 600; border: 1px solid transparent;
  }
  .chip-ativo button { background: none; border: none; color: var(--text-muted); font-size: 13px; line-height: 1; padding: 2px 4px; border-radius: 6px; display: flex; }
  .chip-ativo button:hover { color: var(--text); background: rgba(255,255,255,.12); }

  .grupo-filtro { margin-bottom: 6px; }
  .grupo-filtro-cabecalho {
    display: flex; align-items: center; justify-content: space-between; width: 100%;
    background: none; border: none; padding: 10px 2px; color: var(--text); font-size: 12px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .06em;
  }
  .grupo-filtro-cabecalho .seta { color: var(--text-muted); font-size: 11px; transition: transform 0.2s ease; }
  .grupo-filtro.colapsado .seta { transform: rotate(-90deg); }
  .grupo-filtro-corpo {
    display: grid; grid-template-columns: 1fr; gap: 8px; padding: 4px 10px 14px 2px;
    margin-right: -12px;
  }
  .grupo-filtro-corpo::-webkit-scrollbar { width: 6px; }
  .grupo-filtro-corpo::-webkit-scrollbar-track { background: transparent; }
  .grupo-filtro-corpo::-webkit-scrollbar-thumb { background: var(--border); border-radius: 100px; }
  .grupo-filtro-corpo::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

  /* ---------- SCROLLBAR PADRAO DO SITE ---------- */
  .sidebar, .modal-corpo, #painelForm, .grupo-filtro-corpo {
    scrollbar-width: thin;
    scrollbar-color: var(--border) transparent;
  }
  .sidebar::-webkit-scrollbar, .modal-corpo::-webkit-scrollbar, #painelForm::-webkit-scrollbar { width: 6px; }
  .sidebar::-webkit-scrollbar-track, .modal-corpo::-webkit-scrollbar-track, #painelForm::-webkit-scrollbar-track { background: transparent; }
  .sidebar::-webkit-scrollbar-thumb, .modal-corpo::-webkit-scrollbar-thumb, #painelForm::-webkit-scrollbar-thumb { background: var(--border); border-radius: 100px; }
  .sidebar::-webkit-scrollbar-thumb:hover, .modal-corpo::-webkit-scrollbar-thumb:hover, #painelForm::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }
  .grupo-filtro.colapsado .grupo-filtro-corpo { display: none; }
  .grupo-filtro-vazio { font-size: 11.5px; color: var(--text-muted); padding: 2px 2px 14px; grid-column: 1 / -1; }

  .chip-filtro {
    display: flex; align-items: center; justify-content: space-between; gap: 6px;
    width: 100%; height: 40px; padding: 0 11px; border-radius: 8px;
    border: 1px solid var(--border); background: var(--card); color: var(--text-muted);
    font-size: 12.5px; font-weight: 600; white-space: nowrap; overflow: hidden;
  }
  .chip-filtro span:first-child { overflow: hidden; text-overflow: ellipsis; }
  .chip-filtro .contagem { font-size: 10.5px; color: var(--text-muted); opacity: .7; font-weight: 600; flex-shrink: 0; }
  .chip-filtro:hover { border-color: var(--accent-2); color: var(--text); }
  .chip-filtro.selecionado {
    background: var(--chip-selecionado); border-color: var(--chip-selecionado); color: var(--text);
  }
  .chip-filtro.selecionado .contagem { color: var(--text); opacity: .8; }

  .subchips-wrap {
    display: flex; flex-direction: column; gap: 6px;
    margin: 2px 0 2px 16px; padding-left: 10px; border-left: 2px solid var(--border);
  }
  .chip-sub { height: 34px; font-size: 11.5px; font-weight: 600; }
  @keyframes aparece-filtro { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: none; } }

  /* ---------- CONTEUDO ---------- */
  .conteudo { padding: 24px 32px 60px; max-width: 1500px; }
  .topo { display: flex; justify-content: space-between; align-items: flex-start; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
  .topo h2 { font-size: 20px; font-weight: 700; margin: 0 0 4px; }
  .topo .sub-total { color: var(--text-muted); font-size: 13px; margin: 0; }
  .acoes-topo { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  #btnTema {
    width: 38px; height: 38px; border: 1px solid var(--border); border-radius: 8px;
    background: var(--card); font-size: 16px; display: flex; align-items: center; justify-content: center; padding: 0;
  }
  #btnTema:hover { border-color: var(--accent-2); box-shadow: 0 0 0 3px var(--accent-bg); }
  #btnAbrirForm { padding: 9px 16px; border: none; border-radius: 8px; background: var(--accent); font-size: 13px; font-weight: 700; color: #fff; white-space: nowrap; }
  #btnAbrirForm:hover { box-shadow: 0 6px 18px var(--accent-bg); }
  .btn-secundario { padding: 9px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--accent-2); font-size: 12.5px; font-weight: 700; white-space: nowrap; }
  .btn-secundario:hover { border-color: var(--accent-2); box-shadow: 0 0 0 3px var(--accent-bg); }
  body:not(.modo-edicao) .somente-editor { display: none !important; }
  #btnModoEdicao.ativo { color: #2fbf71; border-color: #2fbf71; }
  .status-pasta-topo { font-size: 11.5px; color: var(--text-muted); padding: 0 4px; white-space: nowrap; }
  #btnMonitorar.ativo { color: #2fbf71; border-color: #2fbf71; }
  .banner-atualizacao {
    display: flex; align-items: center; gap: 14px; justify-content: center;
    background: var(--accent-2); color: #fff; font-size: 13px; font-weight: 700;
    padding: 10px 16px; border-radius: 10px; margin: 14px 0 0;
    animation: aparece-filtro 0.25s ease;
  }
  .banner-atualizacao button {
    border: none; border-radius: 8px; background: rgba(255,255,255,.2); color: #fff;
    font-size: 12.5px; font-weight: 700; padding: 6px 12px;
  }
  .banner-atualizacao button:hover { background: rgba(255,255,255,.32); }

  .aviso { font-size: 12px; color: var(--text-muted); background: var(--accent-bg); border-radius: 8px; padding: 10px 12px; margin: 16px 0; }
  .erro-form { font-size: 12px; color: #ff6b6b; margin: -4px 0 12px; display: none; padding: 8px 10px; border-radius: 7px; background: rgba(255,107,107,.08); }
  .erro-form.mostrar { display: block; }

  .toolbar { display: flex; gap: 8px; margin: 18px 0 22px; flex-wrap: wrap; }
  #busca, #ordenarPor {
    padding: 11px 14px; border: 1px solid var(--border); border-radius: 8px; font-size: 14px;
    background: var(--card); color: var(--text);
  }
  #busca { flex: 1; min-width: 220px; }
  #busca:focus, #ordenarPor:focus { outline: none; border-color: var(--accent-2); box-shadow: 0 0 0 3px var(--accent-bg); }
  #contador { color: var(--text-muted); font-size: 13px; margin-bottom: 14px; }

  /* ---------- GRID NETFLIX ---------- */
  #lista { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 18px; }
  .vazio { grid-column: 1 / -1; text-align: center; color: var(--text-muted); padding: 60px 0; font-size: 14px; border: 1px dashed var(--border); border-radius: 12px; }

  .card-poster {
    position: relative;
    background: linear-gradient(160deg, var(--card), var(--bg-elevado));
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px 18px;
    min-height: 190px;
    display: flex;
    flex-direction: column;
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.25s ease, box-shadow 0.25s ease, border-color 0.25s ease, z-index 0s;
    box-shadow: var(--shadow);
  }
  .card-poster:hover {
    transform: scale(1.06);
    z-index: 5;
    border-color: var(--cor-card, var(--accent-2));
    box-shadow: var(--shadow-hover);
  }
  .card-faixa { position: absolute; left: 0; top: 0; width: 5px; height: 100%; background: var(--cor-card, var(--accent-2)); }
  .card-icone {
    width: 44px; height: 44px; border-radius: 10px; display: flex; align-items: center; justify-content: center;
    font-size: 21px; margin-bottom: 14px;
    background: color-mix(in srgb, var(--cor-card, var(--accent-2)) 16%, transparent);
    color: var(--cor-card, var(--accent-2));
  }
  .card-badge { position: absolute; top: 16px; right: 16px; font-size: 10.5px; font-weight: 700; color: var(--cor-card, var(--accent-2)); background: color-mix(in srgb, var(--cor-card, var(--accent-2)) 14%, transparent); padding: 3px 9px; border-radius: 100px; white-space: nowrap; }
  .card-titulo { font-size: 14.5px; font-weight: 700; margin: 0 0 8px; line-height: 1.35; padding-right: 60px; }
  .card-sintoma { font-size: 12.5px; color: var(--text-muted); line-height: 1.5; margin: 0; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  .card-hover-info {
    position: absolute; inset: auto 0 0 0; padding: 14px 18px 16px;
    background: linear-gradient(180deg, transparent, rgba(0,0,0,.55) 30%, rgba(0,0,0,.85));
    opacity: 0; transform: translateY(6px);
    transition: opacity 0.2s ease, transform 0.2s ease;
    display: flex; flex-direction: column; gap: 8px;
  }
  .card-poster:hover .card-hover-info { opacity: 1; transform: translateY(0); }
  .card-hover-tags { display: flex; gap: 5px; flex-wrap: wrap; }
  .card-hover-tag { font-size: 10px; color: #fff; background: rgba(255,255,255,.14); padding: 2px 7px; border-radius: 100px; }
  .card-hover-acao { font-size: 11.5px; font-weight: 700; color: #fff; display: flex; align-items: center; gap: 6px; }

  /* ---------- MODAL DE DETALHES ---------- */
  #modalDetalhes, #modalCategorias, #modalEstatisticas {
    width: min(680px, calc(100% - 32px));
    max-height: 86vh;
    padding: 0;
    border: 1px solid var(--border);
    border-radius: 16px;
    background: var(--bg-elevado);
    color: var(--text);
    overflow: hidden;
    box-shadow: 0 40px 100px rgba(0,0,0,.6);
  }
  #modalDetalhes::backdrop, #modalCategorias::backdrop, #modalEstatisticas::backdrop { background: rgba(2,4,8,.72); backdrop-filter: blur(10px); }
  #modalDetalhes[open], #modalCategorias[open], #modalEstatisticas[open] { animation: entra-modal 0.22s ease; }
  @keyframes entra-modal { from { opacity: 0; transform: scale(0.97) translateY(6px); } to { opacity: 1; transform: none; } }
  .modal-corpo { overflow-y: auto; max-height: 86vh; }
  .modal-topo { position: relative; padding: 26px 26px 20px; border-bottom: 1px solid var(--border); }
  .modal-icone { width: 50px; height: 50px; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-size: 24px; margin-bottom: 14px; background: color-mix(in srgb, var(--cor-modal, var(--accent-2)) 16%, transparent); color: var(--cor-modal, var(--accent-2)); }
  .modal-topo .badge { font-size: 11px; font-weight: 700; color: var(--cor-modal, var(--accent-2)); background: color-mix(in srgb, var(--cor-modal, var(--accent-2)) 14%, transparent); padding: 3px 10px; border-radius: 100px; }
  .modal-topo h3 { font-size: 19px; margin: 10px 0 0; line-height: 1.35; }
  .btn-fechar-modal {
    position: absolute; top: 18px; right: 18px; width: 34px; height: 34px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--card); color: var(--text); font-size: 18px; display: flex; align-items: center; justify-content: center;
  }
  .btn-fechar-modal:hover { border-color: var(--accent-2); }
  .modal-conteudo { padding: 22px 26px 8px; }
  .campo { margin-bottom: 16px; }
  .campo-label { font-size: 10.5px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); margin-bottom: 6px; }
  .campo-valor { font-size: 13.5px; white-space: pre-line; line-height: 1.55; }
  .campo-valor.mono {
    font-family: ui-monospace, "SF Mono", Consolas, monospace;
    background: var(--mono-bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; white-space: pre; overflow-x: auto;
  }
  .tags { display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 11px; background: var(--tag-bg); color: var(--text-muted); padding: 4px 9px; border-radius: 100px; }
  .modal-acoes { display: flex; gap: 10px; padding: 18px 26px 24px; border-top: 1px solid var(--border); }
  .btn-acao-modal { border: 1px solid var(--border); border-radius: 8px; background: var(--card); color: var(--text-muted); font-size: 12.5px; font-weight: 700; padding: 9px 14px; }
  .btn-acao-modal:hover { border-color: var(--accent-2); color: var(--accent-2); }
  .btn-acao-modal.excluir:hover { border-color: #ff6b6b; color: #ff6b6b; }

  .badge-prioridade[data-nivel="Alta"] { color: #ff6b6b; background: rgba(255,107,107,.14); }
  .badge-prioridade[data-nivel="Media"] { color: #ffb84d; background: rgba(255,184,77,.14); }
  .badge-prioridade[data-nivel="Baixa"] { color: #2fbf71; background: rgba(47,191,113,.14); }
  .modal-autoria { font-size: 11px; color: var(--text-muted); margin-top: 10px; line-height: 1.6; }
  .modal-imagem { width: 100%; border-radius: 10px; border: 1px solid var(--border); margin-bottom: 16px; display: block; }
  .modal-relacionados { padding: 0 26px 20px; }
  .modal-relacionados .campo-label { margin-bottom: 8px; }
  .item-relacionado {
    display: block; width: 100%; text-align: left; padding: 10px 12px; border: 1px solid var(--border);
    border-radius: 8px; background: var(--card); color: var(--text); font-size: 12.5px; font-weight: 600; margin-bottom: 6px;
  }
  .item-relacionado:hover { border-color: var(--accent-2); }

  .stat-bloco { margin-bottom: 22px; }
  .stat-bloco h4 { font-size: 12px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-muted); margin: 0 0 12px; }
  .stat-linha { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; font-size: 12.5px; }
  .stat-linha-nome { width: 130px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .stat-barra-fundo { flex: 1; height: 8px; background: var(--tag-bg); border-radius: 100px; overflow: hidden; }
  .stat-barra-preenchida { height: 100%; background: var(--accent-2); border-radius: 100px; }
  .stat-linha-valor { width: 26px; text-align: right; color: var(--text-muted); flex-shrink: 0; }
  .stat-lista-simples { display: flex; flex-direction: column; gap: 6px; }
  .stat-item-simples {
    display: flex; justify-content: space-between; gap: 10px; padding: 9px 12px;
    border: 1px solid var(--border); border-radius: 8px; background: var(--card); font-size: 12.5px;
  }

  .lista-categorias-gerenciar { display: flex; flex-direction: column; gap: 8px; margin: 18px 0 8px; }
  .linha-categoria {
    display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap;
    padding: 10px 14px; border: 1px solid var(--border); border-radius: 8px; background: var(--card);
  }
  .linha-categoria-nome { font-size: 13px; font-weight: 700; flex: 1; }
  .linha-categoria-contagem { font-size: 11.5px; color: var(--text-muted); white-space: nowrap; }
  .input-editar-categoria {
    flex: 1; padding: 8px 10px; border: 1px solid var(--accent-2); border-radius: 8px;
    font-size: 13px; font-family: inherit; background: var(--bg-elevado); color: var(--text);
  }
  .input-editar-categoria:focus { outline: none; box-shadow: 0 0 0 3px var(--accent-bg); }

  .bloco-subcategorias {
    margin: -2px 0 8px; padding: 14px; border: 1px dashed var(--border); border-radius: 8px; background: var(--bg-elevado);
  }
  .lista-subcategorias { display: flex; flex-direction: column; gap: 6px; margin-top: 12px; }
  .linha-subcategoria {
    display: flex; align-items: center; justify-content: space-between; gap: 10px;
    padding: 8px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--card); font-size: 12.5px;
  }
  .btn-remover-subcategoria { background: none; border: none; color: var(--text-muted); font-size: 14px; line-height: 1; padding: 2px 4px; }
  .btn-remover-subcategoria:hover { color: #ff6b6b; }

  /* ---------- PAINEL DE CADASTRO ---------- */
  #painelForm {
    display: none; position: fixed; inset: 0; z-index: 50;
    padding: 24px; background: rgba(2,4,8,.72); backdrop-filter: blur(1…13861 tokens truncated…    limparFormulario();
    renderizarPendentes();
    document.getElementById('fCategoria').focus();
  });

  btnAbrirForm.addEventListener('click', () => {
    if (editandoIndex !== null) {
      cancelarEdicao();
      return;
    }
    if (painelForm.classList.contains('aberto')) {
      fecharPainelForm();
    } else {
      painelForm.classList.add('aberto');
    }
  });

  function fecharPainelForm() {
    painelForm.classList.remove('aberto');
    if (editandoIndex !== null) cancelarEdicao();
  }

  document.getElementById('btnFecharForm').addEventListener('click', fecharPainelForm);

  painelForm.addEventListener('click', (ev) => {
    if (ev.target === painelForm) fecharPainelForm();
  });

  function preencherFormulario(item) {
    document.getElementById('fCategoria').value = item.categoria;
    atualizarSelectSubcategoria(item.subcategoria || '');
    document.getElementById('fProblema').value = item.problema;
    document.getElementById('fSintoma').value = item.sintoma;
    document.getElementById('fSolucao').value = item.solucao;
    document.getElementById('fComando').value = item.comando;
    document.getElementById('fObservacao').value = item.observacao;
    document.getElementById('fTags').value = item.tags;
    document.getElementById('fPrioridade').value = item.prioridade || 'Media';
    document.getElementById('fImagemUrl').value = item.imagemUrl || '';
  }

  function iniciarEdicao(idx) {
    editandoIndex = idx;
    preencherFormulario(dadosAtual[idx]);
    painelForm.classList.add('aberto');
    btnAdicionarLista.style.display = 'none';
    btnSalvar.textContent = 'Salvar alteracao';
    erroForm.classList.remove('mostrar');
  }

  function cancelarEdicao() {
    editandoIndex = null;
    limparFormulario();
    fecharPainelForm();
    btnAdicionarLista.style.display = '';
    btnSalvar.textContent = pastaSelecionada ? 'Salvar dados.js na pasta' : 'Salvar dados.js';
  }

  async function persistir(listaAtualizada, categoriasParaSalvar) {
    const categoriasFinal = categoriasParaSalvar || categoriasAtual;
    const conteudo = gerarArquivoDados(listaAtualizada, categoriasFinal);

    if (pastaSelecionada) {
      if (ultimoConteudoConhecido !== null) {
        const conteudoNoDisco = await lerConteudoAtualDoArquivo();
        if (conteudoNoDisco !== ultimoConteudoConhecido) {
          throw new Error('Alguem salvou uma atualizacao neste arquivo enquanto voce editava. Aperte F5 para carregar a versao mais nova antes de salvar, senao a alteracao da outra pessoa sera perdida.');
        }
        try {
          await salvarBackup(ultimoConteudoConhecido);
        } catch (e) {
          // backup e melhor-esforco - nao impede o salvamento principal
        }
      }
      await salvarNaPasta(conteudo);
      ultimoConteudoConhecido = conteudo;
    } else {
      baixarArquivo(conteudo);
    }
    dadosAtual = listaAtualizada;
    categoriasAtual = categoriasFinal;
  }

  async function salvarBackup(conteudoAnterior) {
    const pastaBackups = await pastaSelecionada.getDirectoryHandle('backups', { create: true });
    const agoraTexto = new Date().toISOString().replace(/[:.]/g, '-');
    const handleArquivo = await pastaBackups.getFileHandle('dados_' + agoraTexto + '.js', { create: true });
    const writable = await handleArquivo.createWritable();
    await writable.write(conteudoAnterior);
    await writable.close();
  }

  async function excluirItem(idx) {
    if (!confirm('Excluir "' + dadosAtual[idx].problema + '"? Isso reescreve o dados.js.')) return;
    const listaAtualizada = dadosAtual.slice();
    listaAtualizada.splice(idx, 1);
    try {
      await persistir(listaAtualizada);
    } catch (e) {
      erroTopo.textContent = 'Nao foi possivel excluir: ' + e.message;
      erroTopo.classList.add('mostrar');
      return;
    }
    erroTopo.classList.remove('mostrar');
    renderizar();
  }

  function escapaJs(txt) {
    return (txt || '').replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$\{/g, '\\${');
  }

  function gerarArquivoDados(listaCompleta, categoriasLista) {
    const blocosCategorias = (categoriasLista || []).map(c =>
      `  { nome: \`${escapaJs(c.nome)}\`, subcategorias: [${(c.subcategorias || []).map(s => `\`${escapaJs(s)}\``).join(', ')}] }`
    ).join(',\n');

    const blocos = listaCompleta.map(item => `  {
    categoria: \`${escapaJs(item.categoria)}\`,
    subcategoria: \`${escapaJs(item.subcategoria || '')}\`,
    problema: \`${escapaJs(item.problema)}\`,
    sintoma: \`${escapaJs(item.sintoma)}\`,
    solucao: \`${escapaJs(item.solucao)}\`,
    comando: \`${escapaJs(item.comando)}\`,
    observacao: \`${escapaJs(item.observacao)}\`,
    tags: \`${escapaJs(item.tags)}\`,
    prioridade: \`${escapaJs(item.prioridade || 'Media')}\`,
    imagemUrl: \`${escapaJs(item.imagemUrl || '')}\`,
    criadoPor: \`${escapaJs(item.criadoPor || '')}\`,
    criadoEm: \`${escapaJs(item.criadoEm || '')}\`,
    atualizadoPor: \`${escapaJs(item.atualizadoPor || '')}\`,
    atualizadoEm: \`${escapaJs(item.atualizadoEm || '')}\`
  }`).join(',\n');

    return `// ============================================================
// BASE DE CONHECIMENTO - HELPDESK
// ============================================================
// Para adicionar um problema pelo formulario da pagina, use o
// botao "Novo problema" e depois "Salvar dados.js".
// Para gerenciar categorias, use o botao "Categorias".
// Este arquivo foi gerado automaticamente - pode editar na mao
// tambem se preferir.
// ============================================================

const categorias = [
${blocosCategorias}
];

const dados = [
${blocos}
];
`;
  }

  const btnPasta = document.getElementById('btnPasta');
  const statusPasta = document.getElementById('statusPasta');
  const avisoSalvar = document.getElementById('avisoSalvar');
  const statusPastaTopo = document.getElementById('statusPastaTopo');
  const btnReconectarPasta = document.getElementById('btnReconectarPasta');
  let pastaSelecionada = null;
  let ultimoConteudoConhecido = null;
  const suportaPasta = 'showDirectoryPicker' in window;

  async function lerConteudoAtualDoArquivo() {
    const handleArquivo = await pastaSelecionada.getFileHandle('dados.js', { create: true });
    const arquivo = await handleArquivo.getFile();
    return await arquivo.text();
  }

  /* ---------- LEMBRAR A PASTA ENTRE SESSOES (IndexedDB) ---------- */
  // O navegador nao deixa reabrir a pasta sozinho sem nenhuma interacao,
  // mas guardando o handle aqui evitamos que a pessoa tenha que navegar
  // ate a pasta de novo: so precisa de 1 clique pra reconectar (ou nem isso,
  // se o navegador ainda lembrar a permissao).
  const DB_NOME = 'helpdeskFS';
  const STORE_NOME = 'handles';
  const CHAVE_PASTA = 'pastaCompartilhada';

  function abrirDb() {
    return new Promise((resolve, reject) => {
      const req = indexedDB.open(DB_NOME, 1);
      req.onupgradeneeded = () => { req.result.createObjectStore(STORE_NOME); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    });
  }

  async function salvarHandlePastaEmDisco(handle) {
    const db = await abrirDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NOME, 'readwrite');
      tx.objectStore(STORE_NOME).put(handle, CHAVE_PASTA);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function obterHandlePastaSalvo() {
    const db = await abrirDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NOME, 'readonly');
      const req = tx.objectStore(STORE_NOME).get(CHAVE_PASTA);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }

  function marcarPastaConectada(nome) {
    statusPastaTopo.textContent = '📁 ' + nome;
    btnReconectarPasta.style.display = 'none';
    statusPasta.textContent = 'Pasta selecionada: ' + nome + ' - salvando direto ali';
    avisoSalvar.textContent = 'Vai sobrescrever o dados.js dentro de "' + nome + '" direto, sem baixar.';
    btnSalvar.textContent = 'Salvar dados.js na pasta';
    iniciarMonitoramento(pastaSelecionada);
  }

  async function tentarReconectarAutomaticamente() {
    if (!suportaPasta) return;
    try {
      const handle = await obterHandlePastaSalvo();
      if (!handle) return;
      const permissao = await handle.queryPermission({ mode: 'readwrite' });
      if (permissao === 'granted') {
        pastaSelecionada = handle;
        ultimoConteudoConhecido = await lerConteudoAtualDoArquivo();
        marcarPastaConectada(handle.name);
      } else {
        statusPastaTopo.textContent = '📁 ' + handle.name + ' (nao conectado)';
        btnReconectarPasta.style.display = '';
      }
    } catch (e) {
      // handle antigo/invalido - ignora, pessoa pode selecionar de novo
    }
  }

  btnReconectarPasta.addEventListener('click', async () => {
    try {
      const handle = await obterHandlePastaSalvo();
      if (!handle) return;
      const permissao = await handle.requestPermission({ mode: 'readwrite' });
      if (permissao !== 'granted') {
        alert('Permissao negada. Use "Novo problema > Selecionar pasta" para escolher novamente.');
        return;
      }
      pastaSelecionada = handle;
      ultimoConteudoConhecido = await lerConteudoAtualDoArquivo();
      marcarPastaConectada(handle.name);
    } catch (e) {
      alert('Nao foi possivel reconectar: ' + e.message);
    }
  });

  if (!suportaPasta) {
    btnPasta.disabled = true;
    btnPasta.textContent = 'Indisponivel neste navegador';
    statusPasta.textContent = 'Use Chrome ou Edge para salvar direto na pasta. Aqui vai baixar em Downloads.';
  }

  btnPasta.addEventListener('click', async () => {
    try {
      pastaSelecionada = await window.showDirectoryPicker();
      try {
        ultimoConteudoConhecido = await lerConteudoAtualDoArquivo();
      } catch (e) {
        ultimoConteudoConhecido = null;
      }
      try {
        await salvarHandlePastaEmDisco(pastaSelecionada);
      } catch (e) {
        // navegador sem suporte a guardar o handle - so nao vai reconectar automatico
      }
      marcarPastaConectada(pastaSelecionada.name);
    } catch (e) {
      // usuario cancelou a selecao
    }
  });

  tentarReconectarAutomaticamente();

  async function salvarNaPasta(conteudo) {
    const permissao = await pastaSelecionada.requestPermission({ mode: 'readwrite' });
    if (permissao !== 'granted') {
      throw new Error('Permissao de escrita negada.');
    }
    const handleArquivo = await pastaSelecionada.getFileHandle('dados.js', { create: true });
    const writable = await handleArquivo.createWritable();
    await writable.write(conteudo);
    await writable.close();
  }

  function baixarArquivo(conteudo) {
    const blob = new Blob([conteudo], { type: 'text/javascript' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'dados.js';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  btnSalvar.addEventListener('click', async () => {
    const itemAtual = lerFormulario();

    if (editandoIndex !== null) {
      if (!validaCamposObrigatorios(itemAtual)) {
        erroForm.textContent = 'Preencha ao menos categoria, titulo, sintoma e solucao.';
        erroForm.classList.add('mostrar');
        return;
      }
      erroForm.classList.remove('mostrar');
      const listaAtualizada = dadosAtual.slice();
      listaAtualizada[editandoIndex] = marcarAtualizacao({ ...dadosAtual[editandoIndex], ...itemAtual });
      try {
        await persistir(listaAtualizada);
      } catch (e) {
        erroForm.textContent = 'Nao foi possivel salvar na pasta: ' + e.message;
        erroForm.classList.add('mostrar');
        return;
      }
      cancelarEdicao();
      renderizar();
      return;
    }

    const formPreenchido = itemAtual.categoria || itemAtual.problema || itemAtual.sintoma || itemAtual.solucao;

    let novosItens = [...pendentes];

    if (formPreenchido) {
      if (!validaCamposObrigatorios(itemAtual)) {
        erroForm.textContent = 'O formulario tem campos preenchidos pela metade. Complete categoria, titulo, sintoma e solucao, ou limpe-os antes de salvar.';
        erroForm.classList.add('mostrar');
        return;
      }
      novosItens.push(marcarCriacao(itemAtual));
    }

    if (novosItens.length === 0) {
      erroForm.textContent = 'Adicione pelo menos um problema antes de salvar.';
      erroForm.classList.add('mostrar');
      return;
    }

    erroForm.classList.remove('mostrar');

    const listaAtualizada = [...dadosAtual, ...novosItens];

    try {
      await persistir(listaAtualizada);
    } catch (e) {
      erroForm.textContent = 'Nao foi possivel salvar na pasta: ' + e.message;
      erroForm.classList.add('mostrar');
      return;
    }

    limparFormulario();
    pendentes = [];
    renderizarPendentes();
    fecharPainelForm();
    renderizar();
  });

  /* ---------- VISAO GERENCIAL (estatisticas) ---------- */
  const modalEstatisticas = document.getElementById('modalEstatisticas');
  const conteudoEstatisticas = document.getElementById('conteudoEstatisticas');

  function renderizarEstatisticas() {
    const contagemCategoria = {};
    categoriasAtual.forEach(c => { contagemCategoria[c.nome] = 0; });
    dadosAtual.forEach(d => { contagemCategoria[d.categoria] = (contagemCategoria[d.categoria] || 0) + 1; });
    const maiorContagem = Math.max(1, ...Object.values(contagemCategoria));
    const categoriasVazias = categoriasAtual.filter(c => contagemCategoria[c.nome] === 0);

    const porCategoriaHtml = categoriasAtual.map(c => `
      <div class="stat-linha">
        <span class="stat-linha-nome">${c.nome}</span>
        <div class="stat-barra-fundo"><div class="stat-barra-preenchida" style="width:${(contagemCategoria[c.nome] / maiorContagem) * 100}%"></div></div>
        <span class="stat-linha-valor">${contagemCategoria[c.nome]}</span>
      </div>`).join('');

    conteudoEstatisticas.innerHTML = `
      <div class="stat-bloco">
        <h4>Total geral</h4>
        <div class="stat-item-simples"><span>Problemas cadastrados</span><span>${dadosAtual.length}</span></div>
        <div class="stat-item-simples"><span>Categorias cadastradas</span><span>${categoriasAtual.length}</span></div>
      </div>
      <div class="stat-bloco">
        <h4>Problemas por categoria</h4>
        ${porCategoriaHtml || '<div class="grupo-filtro-vazio">Nenhuma categoria cadastrada.</div>'}
      </div>
      ${categoriasVazias.length > 0 ? `
      <div class="stat-bloco">
        <h4>Categorias sem nenhum problema</h4>
        <div class="stat-lista-simples">${categoriasVazias.map(c => `<div class="stat-item-simples"><span>${c.nome}</span></div>`).join('')}</div>
      </div>` : ''}
    `;
  }

  document.getElementById('btnEstatisticas').addEventListener('click', () => {
    renderizarEstatisticas();
    modalEstatisticas.showModal();
  });
  document.getElementById('btnFecharEstatisticas').addEventListener('click', () => modalEstatisticas.close());
  modalEstatisticas.addEventListener('click', (ev) => {
    const rect = modalEstatisticas.getBoundingClientRect();
    const dentro = ev.clientX >= rect.left && ev.clientX <= rect.right && ev.clientY >= rect.top && ev.clientY <= rect.bottom;
    if (!dentro) modalEstatisticas.close();
  });

  /* ---------- AVISO DE ATUALIZACAO (colaboracao) ---------- */
  const btnMonitorar = document.getElementById('btnMonitorar');
  const bannerAtualizacao = document.getElementById('bannerAtualizacao');
  const CHAVE_MONITOR = 'pastaMonitorLeitura';
  let handleMonitor = null;
  let intervaloMonitor = null;

  async function salvarHandleMonitorEmDisco(handle) {
    const db = await abrirDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NOME, 'readwrite');
      tx.objectStore(STORE_NOME).put(handle, CHAVE_MONITOR);
      tx.oncomplete = () => resolve();
      tx.onerror = () => reject(tx.error);
    });
  }

  async function obterHandleMonitorSalvo() {
    const db = await abrirDb();
    return new Promise((resolve, reject) => {
      const tx = db.transaction(STORE_NOME, 'readonly');
      const req = tx.objectStore(STORE_NOME).get(CHAVE_MONITOR);
      req.onsuccess = () => resolve(req.result || null);
      req.onerror = () => reject(req.error);
    });
  }

  function iniciarMonitoramento(handle) {
    handleMonitor = handle;
    btnMonitorar.textContent = '✅ Monitorando atualizações';
    btnMonitorar.classList.add('ativo');
    if (intervaloMonitor) clearInterval(intervaloMonitor);
    intervaloMonitor = setInterval(verificarAtualizacaoNoDisco, 25000);
  }

  async function verificarAtualizacaoNoDisco() {
    const handle = pastaSelecionada || handleMonitor;
    if (!handle || ultimoConteudoConhecido === null) return;
    try {
      const arquivo = await (await handle.getFileHandle('dados.js')).getFile();
      const texto = await arquivo.text();
      if (texto !== ultimoConteudoConhecido) {
        bannerAtualizacao.style.display = 'flex';
      }
    } catch (e) {
      // pasta pode ter ficado indisponivel - ignora ate a proxima checagem
    }
  }

  document.getElementById('btnRecarregarAgora').addEventListener('click', () => location.reload());

  btnMonitorar.addEventListener('click', async () => {
    if (pastaSelecionada) {
      iniciarMonitoramento(pastaSelecionada);
      return;
    }
    try {
      const handle = await window.showDirectoryPicker({ mode: 'read' });
      try { await salvarHandleMonitorEmDisco(handle); } catch (e) {}
      iniciarMonitoramento(handle);
    } catch (e) {
      // usuario cancelou a selecao
    }
  });

  async function tentarRestaurarMonitorLeitura() {
    if (pastaSelecionada) {
      iniciarMonitoramento(pastaSelecionada);
      return;
    }
    try {
      const handle = await obterHandleMonitorSalvo();
      if (!handle) return;
      const permissao = await handle.queryPermission({ mode: 'read' });
      if (permissao === 'granted') {
        iniciarMonitoramento(handle);
      }
    } catch (e) {
      // handle antigo/invalido - ignora
    }
  }

  tentarRestaurarMonitorLeitura();

  renderizar();
</script>
</body>
</html>
