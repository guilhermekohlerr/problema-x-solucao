    const termo = normaliza(elBusca.value.trim());
    const palavraExtra = normaliza((document.getElementById('filtroPalavra') || {}).value || '');
    const campoBusca = (document.getElementById('filtroCampo') || {}).value || 'todos';
    const modoBusca = (document.querySelector('input[name="modoBusca"]:checked') || {}).value || 'todos';
    const ordem = (document.getElementById('filtroOrdem') || {}).value || 'relevancia';
    const categoriaSelecionada = elFiltro.value;
    document.querySelectorAll('.atalho-categoria').forEach(btn => btn.classList.toggle('ativo', btn.dataset.categoria === categoriaSelecionada));

    const filtrados = dados.filter(item => {
      const bateCategoria = !categoriaSelecionada || item.categoria === categoriaSelecionada;
      if (!bateCategoria) return false;
      const alvoLivre = normaliza([item.categoria, item.problema, item.sintoma, item.solucao, item.tags].join(' '));
      if (termo && !alvoLivre.includes(termo)) return false;
      if (!palavraExtra) return true;
      const alvoFiltro = campoBusca === 'todos' ? alvoLivre : normaliza(item[campoBusca]);
      const termos = palavraExtra.split(/\s+/).filter(Boolean);
      return modoBusca === 'todos' ? termos.every(t => alvoFiltro.includes(t)) : termos.some(t => alvoFiltro.includes(t));
    });

    if (ordem === 'az') filtrados.sort((a,b) => a.problema.localeCompare(b.problema));
    if (ordem === 'categoria') filtrados.sort((a,b) => a.categoria.localeCompare(b.categoria));

    elContador.textContent = filtrados.length + ' resultado(s)';

    if (filtrados.length === 0) {
      elLista.innerHTML = '<div class="vazio">Nenhum problema encontrado. Tente outra palavra-chave.</div>';
      return;
    }

    const desenhosCategoria = {
      caixas:'<rect class="preenchimento" x="15" y="24" width="70" height="45" rx="5"/><rect x="15" y="24" width="70" height="45" rx="5"/><path d="M22 33h30v17H22zM60 34h17M60 42h17M25 59h7M38 59h7M51 59h7M64 59h7"/><path d="M31 24v-8h36v8"/>',
      trocas:'<path class="preenchimento" d="M20 34h52l-10-10 8-8 24 23-24 23-8-8 10-10H20z"/><path d="M15 32h57l-10-10M85 52H28l10 10M72 22l13 12-13 12M28 62L15 50l13-12"/>',
      'sistemas web':'<rect class="preenchimento" x="12" y="17" width="76" height="54" rx="5"/><rect x="12" y="17" width="76" height="54" rx="5"/><path d="M12 29h76M20 23h1M27 23h1M34 23h1M30 79h40M50 71v8"/><circle cx="50" cy="49" r="13"/><path d="M37 49h26M50 36c7 7 7 19 0 26M50 36c-7 7-7 19 0 26"/>',
      deposito:'<path class="preenchimento" d="M11 37l39-21 39 21v40H11z"/><path d="M11 37l39-21 39 21M16 34v43h68V34M25 77V45h50v32M25 56h50M25 67h50"/><path d="M40 45v32M60 45v32"/>',
      impressoras:'<rect class="preenchimento" x="18" y="34" width="64" height="35" rx="5"/><path d="M28 35V14h44v21M27 64H18V39c0-3 3-5 6-5h52c3 0 6 2 6 5v25H72M28 55h44v31H28zM35 64h30M35 72h24"/><circle cx="72" cy="43" r="2"/>',
      rfid:'<rect class="preenchimento" x="19" y="22" width="42" height="57" rx="5"/><rect x="19" y="22" width="42" height="57" rx="5"/><circle cx="40" cy="42" r="8"/><path d="M68 33c9 7 9 27 0 34M76 25c14 13 14 37 0 50M84 18c19 18 19 46 0 64M31 68h18"/>',
      mobile:'<rect class="preenchimento" x="29" y="9" width="42" height="82" rx="7"/><rect x="29" y="9" width="42" height="82" rx="7"/><path d="M37 19h26M37 78h26"/><circle cx="50" cy="85" r="2"/><path d="M41 48l6 6 13-15"/>',
      permissoes:'<circle class="preenchimento" cx="43" cy="35" r="15"/><circle cx="43" cy="35" r="15"/><path d="M16 78c3-17 13-27 27-27 9 0 16 4 21 11M70 54l17 7v12c0 9-7 15-17 19-10-4-17-10-17-19V61zM63 72l5 5 10-12"/>',
      impressora:'<path d="M28 35V14h44v21M18 64V39c0-3 3-5 6-5h52c3 0 6 2 6 5v25M28 55h44v31H28zM35 64h30M35 72h24"/>',
      rede:'<circle cx="50" cy="48" r="31"/><path d="M19 48h62M50 17c17 17 17 45 0 62M50 17c-17 17-17 45 0 62M28 29h44M28 67h44"/>'
    };
    const coresCard = ['#43a6ff','#43dfa0','#ffd34d','#a778ff','#ff6680','#ff765f'];
    elLista.innerHTML = filtrados.map((item, i) => {
      const categoriaNormalizada = normaliza(item.categoria);
      const desenho = desenhosCategoria[categoriaNormalizada] || '<circle cx="50" cy="50" r="31"/><path d="M38 40c2-8 8-12 16-12 10 0 17 6 17 15 0 13-16 13-16 24M55 78h.1"/>';
      const cor = coresCard[i % coresCard.length];
      return `
      <article class="card" data-idx="${i}" data-numero="${String(i + 1).padStart(2,'0')}" style="--cor-card:${cor}">
        <span class="card-faixa" aria-hidden="true"></span>
        <div class="card-imagem" aria-hidden="true"><svg viewBox="0 0 100 100">${desenho}</svg></div>
        <div class="card-header">
          <div>
            <p class="card-titulo">${item.problema}</p>
            <span class="card-causa-label">O que pode causar esse problema?</span>
            <p class="card-sintoma">${item.sintoma}</p>
            <div class="card-preview-tags">${(item.tags || '').split(/\s+/).filter(Boolean).slice(0,3).map(tag => `<span class="card-preview-tag">${tag}</span>`).join('')}</div>
          </div>
          <span class="badge">${item.categoria}</span>
        </div>
        <div class="card-detalhe">
          <div class="card-detalhe-inner">
          <div class="campo">
            <div class="campo-label">Solução</div>
            <div class="campo-valor">${item.solucao}</div>
          </div>
          ${item.comando ? `
          <div class="campo">
            <div class="campo-label">Comando / macro</div>
            <div class="campo-valor mono">${item.comando}</div>
          </div>` : ''}
          ${item.observacao ? `
          <div class="campo">
            <div class="campo-label">Observação</div>
            <div class="campo-valor">${item.observacao}</div>
          </div>` : ''}
          ${item.tags ? `
          <div class="tags">${item.tags.split(' ').filter(Boolean).map(t => `<span class="tag">${t}</span>`).join('')}</div>` : ''}
          </div>
        </div>
      </article>
    `}).join('');

    elLista.querySelectorAll('.card').forEach(card => {
      card.addEventListener('click', () => abrirDetalhes(filtrados[Number(card.dataset.idx)]));
    });
  }

  elBusca.addEventListener('input', renderizar);
  elFiltro.addEventListener('change', renderizar);
  document.getElementById('btnAplicarFiltros').addEventListener('click', () => { renderizar(); document.getElementById('painelFiltros').classList.remove('aberto'); });
  document.getElementById('btnLimparFiltros').addEventListener('click', () => { elBusca.value=''; elFiltro.value=''; document.getElementById('filtroPalavra').value=''; document.getElementById('filtroCampo').value='todos'; document.getElementById('filtroOrdem').value='az'; renderizar(); });
  document.getElementById('btnFiltrosMobile').addEventListener('click', () => document.getElementById('painelFiltros').classList.toggle('aberto'));
  renderizar();

  const btnAbrirForm = document.getElementById('btnAbrirForm');
  const painelForm = document.getElementById('painelForm');
  // Organiza o formulario existente em uma janela guiada, sem alterar os dados salvos.
  const formModal = document.createElement('div');
  formModal.className = 'form-modal';
  const formTopo = document.createElement('div');
  formTopo.className = 'form-topo';
  formTopo.innerHTML = '<div><span class="form-kicker">BASE DE CONHECIMENTO</span><h2>Registrar novo problema</h2></div><button class="btn-fechar-form" id="btnFecharForm" type="button" aria-label="Fechar">×</button>';
  const formCorpo = document.createElement('div');
  formCorpo.className = 'form-corpo';
  [...painelForm.children].forEach(el => { if (el.tagName !== 'H2' && !el.classList.contains('linha-botoes') && !el.classList.contains('aviso-form')) formCorpo.appendChild(el); });
  const acoesOriginais = painelForm.querySelector('.linha-botoes');
  const avisoOriginal = painelForm.querySelector('.aviso-form');
  const formAcoes = document.createElement('div');
  formAcoes.className = 'acoes-form-fixas';
  formAcoes.innerHTML = '<span class="linha-pasta-simples">* Preencha categoria, título, sintoma e solução</span>';
  formAcoes.appendChild(acoesOriginais);
  formCorpo.appendChild(avisoOriginal);
  painelForm.append(formModal);
  formModal.append(formTopo, formCorpo, formAcoes);
  const camposPrincipais = [document.getElementById('fCategoria').closest('.linha-2'), document.getElementById('fSintoma').closest('.campo-form')];
  const etapaUm = document.createElement('section'); etapaUm.className = 'form-etapa'; etapaUm.innerHTML = '<div class="form-etapa-titulo"><span class="form-etapa-numero">1</span><div><strong>Identifique o problema</strong><small>Escolha a categoria, escreva um título curto e descreva o que acontece.</small></div></div>';
  camposPrincipais.forEach(el => etapaUm.appendChild(el));
  const etapaDois = document.createElement('section'); etapaDois.className = 'form-etapa'; etapaDois.innerHTML = '<div class="form-etapa-titulo"><span class="form-etapa-numero">2</span><div><strong>Informe a solução</strong><small>Escreva os passos na ordem em que devem ser executados.</small></div></div>';
  etapaDois.appendChild(document.getElementById('fSolucao').closest('.campo-form'));
  const etapaTres = document.createElement('section'); etapaTres.className = 'form-etapa'; etapaTres.innerHTML = '<div class="form-etapa-titulo"><span class="form-etapa-numero">3</span><div><strong>Facilite a pesquisa</strong><small>As palavras-chave podem ser geradas automaticamente.</small></div></div>';
  const campoTags = document.getElementById('fTags').closest('.campo-form');
  const tagsLinha = document.createElement('div'); tagsLinha.className = 'tags-linha';
  campoTags.insertBefore(tagsLinha, document.getElementById('fTags')); tagsLinha.appendChild(document.getElementById('fTags'));
  tagsLinha.insertAdjacentHTML('beforeend','<button class="btn-gerar-tags" id="btnGerarTags" type="button">Gerar automaticamente</button>'); etapaTres.appendChild(campoTags);
  const detalhes = document.createElement('details'); detalhes.className = 'detalhes-avancados'; detalhes.innerHTML = '<summary>+ Informações opcionais</summary><div></div>';
  detalhes.querySelector('div').append(document.getElementById('fComando').closest('.campo-form'),document.getElementById('fObservacao').closest('.campo-form'));
  const referencia = formCorpo.querySelector('.linha-pasta'); formCorpo.insertBefore(etapaUm, referencia); formCorpo.insertBefore(etapaDois, referencia); formCorpo.insertBefore(etapaTres, referencia); formCorpo.insertBefore(detalhes, referencia);
  document.getElementById('btnFecharForm').addEventListener('click',()=>{painelForm.classList.remove('aberto');btnAbrirForm.textContent='+ Novo problema';});
  function gerarTagsAutomaticas(){const comuns=new Set(['para','com','uma','que','nao','não','dos','das','problema','usuario','usuário']);const texto=normaliza(document.getElementById('fProblema').value+' '+document.getElementById('fSintoma').value);const tags=[...new Set(texto.replace(/[^a-z0-9\s]/g,' ').split(/\s+/).filter(p=>p.length>3&&!comuns.has(p)))].slice(0,7);document.getElementById('fTags').value=tags.join(' ');}
  document.getElementById('btnGerarTags').addEventListener('click',gerarTagsAutomaticas);
  document.querySelector('label[for="fSintoma"]').innerHTML = 'O que pode causar esse problema? <span class="obrigatorio">*</span>';
  const listaCategoriasCadastro = document.createElement('datalist');
  listaCategoriasCadastro.id = 'categoriasCadastro';
  listaCategoriasCadastro.innerHTML = categorias.map(c => `<option value="${c}"></option>`).join('');
  document.body.appendChild(listaCategoriasCadastro);
  document.getElementById('fCategoria').setAttribute('list','categoriasCadastro');
  const erroForm = document.getElementById('erroForm');
  const btnSalvar = document.getElementById('btnSalvar');

  const listaPendentesEl = document.getElementById('listaPendentes');
  const btnAdicionarLista = document.getElementById('btnAdicionarLista');
  let pendentes = [];

  const camposForm = ['fCategoria','fProblema','fSintoma','fSolucao','fComando','fObservacao','fTags'];

  function lerFormulario() {
    if (!document.getElementById('fTags').value.trim() && (document.getElementById('fProblema').value.trim() || document.getElementById('fSintoma').value.trim())) gerarTagsAutomaticas();
    return {
      categoria: document.getElementById('fCategoria').value.trim(),
      problema: document.getElementById('fProblema').value.trim(),
      sintoma: document.getElementById('fSintoma').value.trim(),
      solucao: document.getElementById('fSolucao').value.trim(),
      comando: document.getElementById('fComando').value.trim(),
      observacao: document.getElementById('fObservacao').value.trim(),
      tags: document.getElementById('fTags').value.trim()
    };
  }

  function limparFormulario() {
    camposForm.forEach(id => { document.getElementById(id).value = ''; });
  }

  function validaCamposObrigatorios(item) {
    return item.categoria && item.problema && item.sintoma && item.solucao;
  }

  function renderizarPendentes() {
    if (pendentes.length === 0) {
      listaPendentesEl.innerHTML = '';
      return;
    }
    const contador = `<div class="contador-pendentes">${pendentes.length} item(ns) prontos para salvar</div>`;
    const itens = pendentes.map((item, i) => `
      <div class="item-pendente">
        <span><span class="item-pendente-titulo">${item.problema}</span> <span class="item-pendente-cat">- ${item.categoria}</span></span>
        <button type="button" class="btn-remover-pendente" data-remover="${i}" aria-label="Remover item">✕</button>
      </div>
    `).join('');
    listaPendentesEl.innerHTML = contador + itens;

    listaPendentesEl.querySelectorAll('.btn-remover-pendente').forEach(btn => {
      btn.addEventListener('click', () => {
        pendentes.splice(Number(btn.dataset.remover), 1);
        renderizarPendentes();
      });
    });
  }

  btnAdicionarLista.addEventListener('click', () => {
    const item = lerFormulario();
    if (!validaCamposObrigatorios(item)) {
      erroForm.textContent = 'Preencha ao menos categoria, título, causa do problema e solução antes de adicionar.';
      erroForm.classList.add('mostrar');
      return;
    }
    erroForm.classList.remove('mostrar');
    pendentes.push(item);
    limparFormulario();
    renderizarPendentes();
    document.getElementById('fCategoria').focus();
  });

  btnAbrirForm.addEventListener('click', () => {
    painelForm.classList.toggle('aberto');
    btnAbrirForm.textContent = painelForm.classList.contains('aberto') ? 'Fechar' : '+ Novo problema';
  });

  function escapaJs(txt) {
    return (txt || '').replace(/\\/g, '\\\\').replace(/`/g, '\\`').replace(/\$\{/g, '\\${');
  }

  function gerarArquivoDados(listaCompleta) {
    const blocos = listaCompleta.map(item => `  {
    categoria: \`${escapaJs(item.categoria)}\`,
    problema: \`${escapaJs(item.problema)}\`,
    sintoma: \`${escapaJs(item.sintoma)}\`,
    solucao: \`${escapaJs(item.solucao)}\`,
    comando: \`${escapaJs(item.comando)}\`,
    observacao: \`${escapaJs(item.observacao)}\`,
    tags: \`${escapaJs(item.tags)}\`
  }`).join(',\n');

    return `// ============================================================
// BASE DE CONHECIMENTO - HELPDESK
// ============================================================
// Para adicionar um problema pelo formulario da pagina, use o
// botao "Novo problema" e depois "Salvar dados.js".
// Este arquivo foi gerado automaticamente - pode editar na mao
// tambem se preferir.
// ============================================================

const dados = [
${blocos}
];
`;
  }

  const btnPasta = document.getElementById('btnPasta');
  const statusPasta = document.getElementById('statusPasta');
  const avisoSalvar = document.getElementById('avisoSalvar');
  let pastaSelecionada = null;
  const suportaPasta = 'showDirectoryPicker' in window;

  if (!suportaPasta) {
    btnPasta.disabled = true;
    btnPasta.textContent = 'Indisponivel neste navegador';
    statusPasta.textContent = 'Use Chrome ou Edge para salvar direto na pasta. Aqui vai baixar em Downloads.';
  }

  btnPasta.addEventListener('click', async () => {
    try {
      pastaSelecionada = await window.showDirectoryPicker();
      statusPasta.textContent = 'Pasta selecionada: ' + pastaSelecionada.name + ' - salvando direto ali';
      avisoSalvar.textContent = 'Vai sobrescrever o dados.js dentro de "' + pastaSelecionada.name + '" direto, sem baixar.';
      btnSalvar.textContent = 'Salvar dados.js na pasta';
    } catch (e) {
      // usuario cancelou a selecao
    }
  });

  async function salvarNaPasta(conteudo) {
    const permissao = await pastaSelecionada.requestPermission({ mode: 'readwrite' });
    if (permissao !== 'granted') {
      throw new Error('Permissao de escrita negada.');
    }
    const handleArquivo = await pastaSelecionada.getFileHandle('dados.js', { create: true });
    const writable = await handleArquivo.createWritable();
    await writable.write(conteudo);
    await writable.close();
  }

  function baixarArquivo(conteudo) {
    const blob = new Blob([conteudo], { type: 'text/javascript' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = 'dados.js';
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  btnSalvar.addEventListener('click', async () => {
    const itemAtual = lerFormulario();
    const formPreenchido = itemAtual.categoria || itemAtual.problema || itemAtual.sintoma || itemAtual.solucao;

    let novosItens = [...pendentes];

    if (formPreenchido) {
      if (!validaCamposObrigatorios(itemAtual)) {
        erroForm.textContent = 'O formulário está incompleto. Preencha categoria, título, causa do problema e solução, ou limpe os campos antes de salvar.';
        erroForm.classList.add('mostrar');
        return;
      }
      novosItens.push(itemAtual);
    }

    if (novosItens.length === 0) {
      erroForm.textContent = 'Adicione pelo menos um problema antes de salvar.';
      erroForm.classList.add('mostrar');
      return;
    }

    erroForm.classList.remove('mostrar');

    const listaAtualizada = [...dados, ...novosItens];
    const conteudo = gerarArquivoDados(listaAtualizada);

    try {
      if (pastaSelecionada) {
        await salvarNaPasta(conteudo);
      } else {
        baixarArquivo(conteudo);
      }
    } catch (e) {
      erroForm.textContent = 'Não foi possível salvar na pasta: ' + e.message;
      erroForm.classList.add('mostrar');
      return;
    }

    ['fCategoria','fProblema','fSintoma','fSolucao','fComando','fObservacao','fTags'].forEach(id => {
      document.getElementById(id).value = '';
    });
    pendentes = [];
    renderizarPendentes();
    painelForm.classList.remove('aberto');
    btnAbrirForm.textContent = '+ Novo problema';
  });
</script>
</body>
</html>
